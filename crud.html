<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
    <Script>
        let players = [
            {
                name: "Roanldo",
                nation: "Portugal",
                position: "ST",
                height: "187",
                weight: "83"
            },
            {
                name: "Son",
                nation: "Korea",
                position: "CF",
                height: "183",
                weight: "77"
            },
            {
                name: "Benzema",
                nation: "France",
                position: "ST",
                height: "185",
                weight: "81"
            }
        ]

        window.addEventListener("load", function () {
            const tbody = document.querySelector("#body");
            const addbtn = document.querySelector("#add");
            const name = document.querySelector("#name");
            const nation = document.querySelector("#nation");
            const position = document.querySelector("#position");
            const height = document.querySelector("#height");
            const weight = document.querySelector("#weight");

            function render() {
                tbody.innerHTML = "";

                for (let i = 0; i < players.length; i++) {
                    const tr = document.createElement("tr");
                    const td = document.createElement("td");
                    tr.innerHTML = `
                        <td>${players[i].name}</td>
                        <td>${players[i].nation}</td>
                        <td>${players[i].position}</td> 
                        <td>${players[i].height}</td>
                        <td>${players[i].weight}</td>
                    `;
                    
                    const editbtn = document.createElement("button");
                    editbtn.textContent = "수정";
                    editbtn.className = "btn btn-warning btn-sm";

                    const deletebtn = document.createElement("button");
                    deletebtn.textContent = "삭제";
                    deletebtn.className = "btn btn-danger btn-sm";

                    deletebtn.addEventListener("click",function(e){
                        if(confirm("정말로 삭제하시겠습니까?")){
                            splice(i,1);
                            render();
                        }
                    });

                    td.appendChild(editbtn);
                    td.appendChild(deletebtn);
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                }
            }
            render();
        });
    </Script>
</head>

<body>
    <nav class="navbar bg-dark">
        <div class="text-white p-2 fw-bold">축구 선수 관리 Program</div>
    </nav>
    <main>
        <div class="container col-12 mt-3">
            <form method="get" action="">
                <div class="row g-3 mx-3">
                    <div class="col-5 mx-3">
                        <label for="name" class="mb-2 fw-bold">* 이름</label>
                        <input type="text" placeholder="이름을 입력하세요." class="form-control border border-secondary"
                            id="name">
                    </div>
                    <div class="col-5 mx-3">
                        <label for="nation" class="mb-2 fw-bold">* 국가</label>
                        <input type="text" placeholder="국가를 입력하세요." class="form-control border border-secondary"
                            id="nation">
                    </div>
                </div>
                <div class="row g-3 mt-3 mx-3">
                    <div class="col-5 mx-3">
                        <label for="positon" class="mb-2 fw-bold">* 포지션</label>
                        <input type="text" placeholder="포지션을 입력(ex: ST, CB)"
                            class="form-control border border-secondary" id="position">
                    </div>
                    <div class="col-5 mx-3">
                        <label for="height" class="mb-2 fw-bold">* 신장</label>
                        <input type="text" placeholder="키를 입력하세요." class="form-control border border-secondary"
                            id="height">
                    </div>
                </div>
                <div class="row g-3 mt-3 mx-3">
                    <div class="col-5 mx-3">
                        <label for="weight" class="mb-2 fw-bold">* 몸무게</label>
                        <input type="text" placeholder="몸무게를 입력" class="form-control border border-secondary"
                            id="weight">
                    </div>
                </div>
                <div class="text-center">
                    <input type="submit" id="add" value="선수 등록하기" class="btn btn-primary w-50 btn-lg rounded-3 mt-5">
                </div>
            </form>
        </div>
        <hr class="mt-5">
        <div class="text-center fw-bold" style="font-size: x-large;">player-list</div>

        <div class="container mt-5">
            <table class="table text-center align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Name</th>
                        <th>Nation</th>
                        <th>Postion</th>
                        <th>Height</th>
                        <th>Weight</th>
                        <th>수정/삭제</th>
                    </tr>
                </thead>
                <tbody id="body">

                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
