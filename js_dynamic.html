<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
    <script>
        window.addEventListener("load", function () {
            const t1 = document.querySelector("#t1");
            const btn = document.querySelector("#btn");
            const list = document.querySelector("#list");
            btn.addEventListener("click", function (e) {
                const input = t1.value.split(",");
                for (let i = 0; i < input.length; i++) {
                    const li = document.createElement("li");
                    li.style="padding-right:5px;"
                    li.textContent = input[i];
                    list.appendChild(li);
                    t1.value = "";

                    const del = document.createElement("button");
                    del.class="pl-3"
                    del.textContent = "삭제";
                    li.appendChild(del);

                    del.addEventListener("click", delet);
                }
            });

        });
        function delet(e) {
            e.target.parentElement.remove();
        };
    </script>
</head>

<body>
    <form id="form" action="" method="get" class="p-5">
        <label class="fw-bold" style="font-family: Georgia, 'Times New Roman', Times, serif;">Add Book list</label>
        <br><input type="text" id="t1" placeholder="책 제목 입력" class="text-control"><br><br>

        <input type="button" id="btn" value="add" class="btn btn-primary">
    </form>
    <ul id="list">
    </ul>
</body>

</html>
