<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 버튼 및 계산기 자바스크립트 실습 -->
    <script>
        window.addEventListener("load", function () {
            const btn = document.querySelector("#addBtn");
            btn.addEventListener("click", function add(event) {
                const num1 = document.querySelector("#num1");
                const num2 = document.querySelector("#num2");
                const result = Number(num1) + Number(num2);
                document.querySelector("#result").value = result;
            });
        })
        function clickMe() {
            const btn = document.querySelector("#clickBtn");
            alert("버튼 클릭됨");
            btn.innerHTML = "<h1>버튼이 클릭됨</h1>";
        }


        window.addEventListener("load", function () {
            const clcikBtn2 = document.querySelector("#clickBtn2");
            clcikBtn2.addEventListener("click", clickMe);

            const form=document.querySelector("#login");
            form.addEventListener("submit",function(e){
                const name=document.querySelector("#name");
                if(name.value==""){
                    e.preventDefault();
                    alert("이름 입력하세요.");
                    name.focus();
                    return;
                }
                
                alert("제출됨.");
            })
        });

    </script>
</head>

<body>

    <!-- 클릭버튼 실습 -->
    <h3>Internal JS</h3>
    <button id="clickBtn2">Click me</button>

    <!-- 클릭버튼 실습 -->
    <h3>Inline JS</h3>
    <button id="clickBtn" onclick="clickMe()">Click me</button>




    <!-- 계산기 실습 -->
    <h1>덧셈 계산기</h1>
    <input type="text" id="num1" size="4">
    <input type="text" id="num2" size="4">
    <button id="addBtn">+</button>
    <input id="result" readonly>


    <!-- form js연습 -->
    <br><br><br>
    <form action="" method="post" id="login">
        <input type="text" id="name" placeholder="이름을 입력"><br>
        <button id="submit">로그인</button>
    </form>
</body>

</html>
